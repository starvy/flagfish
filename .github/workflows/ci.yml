name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.5"
  NODE_VERSION: "24"

jobs:
  # =========================================================================
  # ⚠️  NON-NEGOTIABLE. CLAUDE.md #1: internal/domain imports NOTHING.
  #
  # Its own job, first in the list, so that when it fails the PR check list says
  # "boundaries" and not "some lint thing" — without it, `domain` grows a
  # *pgxpool.Pool within a month.
  #
  # This runs in ~15s with no services and no linter. There is no excuse to skip it.
  # =========================================================================
  boundaries:
    name: ⚠️ import boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Install pinned tools
        run: go -C tools install tool
        env:
          GOBIN: ${{ github.workspace }}/bin

      # The `go list`-based check. Independent of golangci-lint, and — unlike
      # depguard — it cannot be silenced with a //nolint comment.
      - name: internal/domain imports nothing
        run: ${{ github.workspace }}/bin/task check-boundaries

      # The fx dependency graph is validated WITHOUT a database: fx.ValidateApp
      # resolves every provider and invocation for all three shipping topologies
      # (serve, worker, serve --with-worker) without constructing anything. A
      # missing provider or a broken interface fails here, in seconds, no Postgres
      # required — instead of at `flagfish serve` on a customer's box.
      - name: fx graph validates (serve / worker / with-worker)
        run: go test ./internal/app/...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            tools/go.sum

      # golangci-lint is pinned in tools/go.mod, so CI and the laptop run the
      # SAME version. A CI-only lint version is a config that drifts silently and
      # then fails on someone else's PR.
      - name: Install pinned tools
        run: go -C tools install tool
        env:
          GOBIN: ${{ github.workspace }}/bin

      - name: Cache golangci-lint analysis
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('tools/go.sum', '.golangci.yml') }}
          restore-keys: golangci-${{ runner.os }}-

      # depguard (inside this run) is the primary enforcement of the domain
      # boundary; the `boundaries` job above is the backstop.
      - name: golangci-lint
        run: ${{ github.workspace }}/bin/golangci-lint run --output.text.colors=false

      - name: gofumpt / goimports are clean
        run: |
          ${{ github.workspace }}/bin/golangci-lint fmt --diff

  # =========================================================================
  # NilAway — ADVISORY. Uber's inter-procedural nil analysis catches panics the
  # type system cannot, but it is young enough that a false positive should not
  # block a merge. `continue-on-error` makes this a report, not a gate: the check
  # shows up amber, never red. It found zero issues the day it landed; if that
  # holds it graduates to a blocking step.
  # =========================================================================
  nilaway:
    name: nilaway (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Install pinned tools
        run: go -C tools install tool
        env:
          GOBIN: ${{ github.workspace }}/bin

      - name: NilAway
        run: ${{ github.workspace }}/bin/nilaway -include-pkgs="github.com/starvy/flagfish" ./...

  # =========================================================================
  # DRIFT. The generated code and the OpenAPI document are derived artifacts: if
  # they can go stale, drift becomes a bug report instead of a BUILD FAILURE.
  # =========================================================================
  drift:
    name: drift (sqlc + openapi + generate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Install pinned tools
        run: go -C tools install tool
        env:
          GOBIN: ${{ github.workspace }}/bin

      # The migrations are the schema source of truth, and sqlc verifies the
      # hand-written SQL against them at build time. If internal/db/*.gen.go does
      # not match what sqlc would produce from the current SQL, the checked-in
      # code is a LIE about the database.
      - name: sqlc diff (schema drift)
        run: ${{ github.workspace }}/bin/task sqlc-diff

      # The OpenAPI document is the public contract, and flagfishctl is its first
      # consumer. Huma derives it from the handlers, so a handler change that
      # alters the API surface must show up as a diff a human approved.
      - name: generated code + openapi.yaml are current
        run: ${{ github.workspace }}/bin/task check-generated

      - name: show the drift
        if: failure()
        run: git --no-pager diff --stat && git --no-pager diff

  # =========================================================================
  # TESTS — against a REAL Postgres 17.
  #
  # "Real Postgres, never a mock — the invariants live in the CONSTRAINTS, and a
  #  mock cannot fail the way a database can." (CLAUDE.md)
  #
  # The concurrency suite is the product pitch: every invariant it pins is enforced
  # by a constraint, a lock, or an ON CONFLICT. A mocked CI would prove nothing.
  # =========================================================================
  test:
    name: test (race, real postgres)
    runs-on: ubuntu-latest

    env:
      # Same DSN shape the Taskfile and .env.example use, so a failing CI run is
      # reproducible locally with `task up && task test-race` and nothing else.
      TEST_DATABASE_URL: postgres://flagfish:flagfish@localhost:5433/flagfish_test?sslmode=disable
      DATABASE_URL: postgres://flagfish:flagfish@localhost:5433/flagfish_test?sslmode=disable
      MODESRC_DATABASE_URL: postgres://flagfish:flagfish@localhost:5433/flagfish_test_modesrc?sslmode=disable
      # The standing inventory sweep reads its own variable so it only runs where it is set.
      # The gaps it enumerated are closed, so it is now enforced: a migration that adds an
      # unclassified column, an unwritable config key, or a destructive ledger FK fails here.
      SCHEMA_DATABASE_URL: postgres://flagfish:flagfish@localhost:5433/flagfish_test?sslmode=disable
      # The files suite talks to a real object store — a mock cannot fail the way S3 does.
      # Same values the Taskfile defaults to, so a CI failure reproduces locally unchanged.
      TEST_S3_ENDPOINT: localhost:9002
      TEST_S3_BUCKET: flagfish-test
      TEST_S3_ACCESS_KEY: flagfishtest
      TEST_S3_SECRET_KEY: flagfishtest123

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Install pinned tools
        run: go -C tools install tool
        env:
          GOBIN: ${{ github.workspace }}/bin

      # Not a `services:` container: the image needs `server /data`, and a service
      # container cannot override the image command. The suite calls EnsureBucket itself,
      # so nothing has to pre-create the bucket.
      - name: Start MinIO
        run: |
          docker run -d --name minio-test -p 9002:9000 \
            -e MINIO_ROOT_USER="$TEST_S3_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$TEST_S3_SECRET_KEY" \
            minio/minio:RELEASE.2025-04-08T15-41-24Z server /data
          for _ in $(seq 1 30); do
            if curl -sf "http://$TEST_S3_ENDPOINT/minio/health/live" >/dev/null; then
              echo "minio ready"; exit 0
            fi
            sleep 1
          done
          echo "minio never became healthy"; docker logs minio-test; exit 1

      # Not a `services:` container either: the concurrency suite runs N goroutines each
      # holding a real connection, so max_connections must be raised — and that takes a
      # server flag. A service container cannot pass a command, and `ALTER SYSTEM SET`
      # only applies after a restart the container never gets (it silently left the
      # server at the default 100 and the suite died with "too many clients").
      - name: Start Postgres
        run: |
          docker run -d --name postgres-ci -p 5433:5432 \
            -e POSTGRES_USER=flagfish \
            -e POSTGRES_PASSWORD=flagfish \
            -e POSTGRES_DB=flagfish_test \
            -e POSTGRES_INITDB_ARGS="--encoding=UTF8 --locale=C" \
            --tmpfs /var/lib/postgresql/data \
            --cpus 2 \
            postgres:17-alpine \
            -c max_connections=200 -c fsync=off -c synchronous_commit=off -c log_lock_waits=on
          # Wait from the HOST: during initdb the server does a socket-only first start,
          # so an in-container pg_isready can pass before the real (TCP) server is up.
          for _ in $(seq 1 30); do
            if pg_isready -h localhost -p 5433 -U flagfish -d flagfish_test -q; then
              got="$(psql "$TEST_DATABASE_URL" -tAc 'SHOW max_connections')"
              test "$got" = "200" || { echo "max_connections=$got, want 200"; exit 1; }
              echo "postgres ready (max_connections=$got)"; exit 0
            fi
            sleep 1
          done
          echo "postgres never became ready"; docker logs postgres-ci; exit 1

      - name: Migrate
        run: ${{ github.workspace }}/bin/task migrate-test
        env:
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      # test/modesrc owns a second database: it boots against a mismatched
      # instance.user_mode, which the shared test database cannot hold alongside
      # everything else. `go test ./...` below reaches that suite, so it has to exist.
      - name: Create and migrate the play-mode database
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE flagfish_test_modesrc'
          ${{ github.workspace }}/bin/goose -dir internal/db/migrations postgres "$MODESRC_DATABASE_URL" up

      - name: go build
        run: go build ./...

      # -race is not optional. This project claims the hard bugs in a CTF platform are
      # races; shipping our own would be embarrassing.
      #
      # -p 1: several suites OWN the database (they TRUNCATE and re-seed). Run in
      # parallel against one Postgres they deadlock and trip each other's FK
      # constraints. Serial package execution is the price of a shared test database.
      - name: go test -race (layers 1 + 3 + 4)
        run: go test -race -shuffle=on -p 1 -tags=integration -timeout=15m ./...

      # ⭐ Layer 2, run separately and with -count=1 so a flaky race cannot be
      # papered over by the test cache. -v names the failing case.
      - name: ⭐ concurrency suite
        run: go test -race -count=1 -p 1 -tags=integration -timeout=15m -v ./test/concurrency/...

      # 🔒 The authorization suite. Same isolation rules.
      - name: 🔒 security suite
        run: go test -race -count=1 -p 1 -tags=integration -timeout=10m -v ./test/security/...

      - name: Postgres logs on failure
        if: failure()
        run: docker logs postgres-ci 2>&1 | tail -100 || true

  # The image is the deliverable: one static binary, embedded SPA + migrations.
  # If it does not build, "one binary" is aspirational.
  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: flagfish:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}

      # The binary must run from an EMPTY directory: no config file, no assets on
      # disk, nothing but the process.
      - name: Binary runs from an empty directory
        run: docker run --rm --entrypoint /flagfish flagfish:ci --help || true
