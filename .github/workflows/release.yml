name: release

# Publish the production image to GHCR on a version tag. This never runs on a
# branch push or a PR — only when a `v*` tag is pushed — so a release is an
# explicit act (`git tag v0.1.0 && git push --tags`), not a side effect of merging.
on:
  push:
    tags: ["v*"]

# Floor for every job; the two that need more widen it themselves — the image job
# to push to ghcr.io, the release job to create the release. No Docker Hub account
# and no extra repository secret either way.
permissions:
  contents: read

# One release per tag. A re-pushed tag supersedes an in-flight run rather than
# racing it to the same image reference.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # github.repository is `starvy/flagfish` → ghcr.io/starvy/flagfish, so the image
  # tracks the repo name automatically instead of being hardcoded here.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    name: build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Derive the tag list and OCI labels from the git ref. For a full release
      # (v0.1.0) this produces `0.1.0`, `0.1`, and `latest`; for a prerelease
      # (v0.1.0-rc.1) it produces only `0.1.0-rc.1` — latest=auto withholds the
      # moving tag from prereleases, so `docker pull …:latest` never lands on an rc.
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=flagfish

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # amd64 only for now: the Dockerfile's Go stage builds for the runner's
          # native arch. arm64 is a follow-up — cross-compile with $BUILDPLATFORM +
          # $TARGETARCH in the Dockerfile, then add linux/arm64 here.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The tag becomes the binary's `--version`, the commit its build stamp.
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          # Share the layer cache with the CI docker-image job (also type=gha).
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Keep the manifest single-platform: provenance/SBOM add attestation
          # manifests that show as a stray unknown/unknown entry in the GHCR UI and
          # trip older compose/podman pulls. Add them once multi-arch is in.
          provenance: false

  # Left as a DRAFT on purpose: publishing is a human act. The notes are generated
  # but nobody has read them yet, and a draft is the last point where a bad tag can
  # be walked back without an announcement going out. `needs: image` means the draft
  # only ever appears once the image it advertises is actually pullable.
  release:
    name: draft github release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail

          # Semver spells a prerelease with a hyphen: v0.1.0-rc.1 is one, v0.1.0 is
          # not. This mirrors metadata-action's latest=auto, so the release and the
          # `latest` image tag agree on what counts as a real release.
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac

          # Ask the API for the notes rather than gh's --generate-notes so the body
          # is composed here: pull instructions first, changelog under them.
          notes="$(gh api "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body)"
          {
            printf '## Container image\n\n```\ndocker pull %s:%s\n```\n\n' "$IMAGE" "${TAG#v}"
            printf '%s\n' "$notes"
          } > notes.md

          # Re-pushing a tag re-runs this job; keep it idempotent instead of failing
          # on an existing draft.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --draft --notes-file notes.md "${flags[@]}"
          else
            gh release create "$TAG" --repo "$REPO" --draft --title "$TAG" --notes-file notes.md "${flags[@]}"
          fi
