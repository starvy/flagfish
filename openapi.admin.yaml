          examples:
            - /api/v1/admin/schemas/AdminUpdateBracketInputBody.json
          format: uri
          readOnly: true
          type: string
        description:
          type: string
        name:
          maxLength: 128
          minLength: 1
          type: string
      type: object
    AdminUpdateChallengeInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/admin/schemas/AdminUpdateChallengeInputBody.json
          format: uri
          readOnly: true
          type: string
        attribution:
          type:
            - string
            - "null"
        category:
          maxLength: 128
          minLength: 1
          type: string
        connection_info:
          type:
            - string
            - "null"
        decay:
          format: int32
          minimum: 1
          type:
            - integer
            - "null"
        description:
          type: string
        first_blood:
          enum:
            - none
            - announce
            - bonus
          type: string
        first_blood_bonus:
          format: int32
          minimum: 1
          type:
            - integer
            - "null"
        function:
          enum:
            - static
            - linear
            - logarithmic
          type: string
        initial:
          format: int32
          minimum: 0
          type:
            - integer
            - "null"
        logic:
          enum:
            - any
            - all
          type: string
        max_attempts:
          format: int32
          minimum: 0
          type: integer
        minimum:
          format: int32
          minimum: 0
          type:
            - integer
            - "null"
        name:
          maxLength: 256
          minLength: 1
          type: string
        position:
          format: int32
          type: integer
        value:
          format: int32
          minimum: 0
          type: integer
      type: object
    AdminUpdateFlagInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/admin/schemas/AdminUpdateFlagInputBody.json
          format: uri
          readOnly: true
          type: string
        case_insensitive:
          type: boolean
        content:
          minLength: 1
          type: string
        type:
          enum:
            - static
            - regex
          type: string
      type: object
    AdminUpdateHintInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/admin/schemas/AdminUpdateHintInputBody.json
          format: uri
          readOnly: true
          type: string
        content:
          minLength: 1
          type: string
        cost:
          format: int32
          minimum: 0
          type: integer
        position:
          format: int32
          type: integer
        prerequisites:
          items:
            format: int64
            type: integer
          maxItems: 64
          type:
            - array
            - "null"
        title:
          maxLength: 256
          type: string
      type: object
    AdminUserBody:
      additionalProperties: false
      properties:
        banned:
          type: boolean
        created_at:
          format: date-time
          type: string
        email:
          type: string
        hidden:
          type: boolean
        id:
          format: int64
          type: integer
        name:
          type: string
        role:
          type: string
        team_id:
          format: int64
          type: integer
        verified:
          type: boolean
      required:
        - id
        - name
        - email
        - role
        - verified
        - banned
        - hidden
        - created_at
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/admin/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Item:
      additionalProperties: false
      properties:
        id:
          format: int64
          type: integer
        position:
          format: int32
          type: integer
      required:
        - id
        - position
      type: object
    NotificationBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/admin/schemas/NotificationBody.json
          format: uri
          readOnly: true
          type: string
        content:
          type: string
        date:
          format: date-time
          type: string
        id:
          format: int64
          type: integer
        title:
          type: string
      required:
        - id
        - title
        - content
        - date
      type: object
info:
  title: flagfish (admin)
  version: 1.0.0
openapi: 3.1.0
paths:
  /accounts/{accountID}/bracket:
    put:
      operationId: admin-assign-bracket
      parameters:
        - in: path
          name: accountID
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAssignBracketInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAssignBracketOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Assign an account to a bracket (or clear it)
      tags:
        - admin/brackets
  /anticheat/accounts/{id}:
    get:
      operationId: admin-anticheat-account
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcAccountReportOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: One account's sharing and IP-overlap evidence
      tags:
        - admin/anticheat
  /anticheat/flag-sharing:
    get:
      operationId: admin-anticheat-flag-sharing
      parameters:
        - explode: false
          in: query
          name: page
          schema:
            default: 1
            format: int64
            maximum: 1000000
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: per_page
          schema:
            default: 50
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcFlagSharingOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Flag-sharing evidence grouped by offender pair (paginated)
      tags:
        - admin/anticheat
  /anticheat/ip-overlap:
    get:
      operationId: admin-anticheat-ip-overlap
      parameters:
        - explode: false
          in: query
          name: min_accounts
          schema:
            default: 2
            format: int64
            maximum: 1000
            minimum: 2
            type: integer
        - explode: false
          in: query
          name: page
          schema:
            default: 1
            format: int64
            maximum: 1000000
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: per_page
          schema:
            default: 50
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcIPOverlapOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Accounts sharing a submission IP (signal, not verdict; paginated)
      tags:
        - admin/anticheat
  /anticheat/unissued-solves:
    get:
      operationId: admin-anticheat-unissued-solves
      parameters:
        - explode: false
          in: query
          name: page
          schema:
            default: 1
            format: int64
            maximum: 1000000
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: per_page
          schema:
            default: 50
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcUnissuedSolvesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Solves on unique-flag challenges by accounts never issued an instance (paginated)
      tags:
        - admin/anticheat
  /audit:
    get:
      operationId: admin-list-audit
      parameters:
        - explode: false
          in: query
          name: page
          schema:
            default: 1
            format: int64
            maximum: 1000000
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: per_page
          schema:
            default: 50
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: actor
          schema:
            format: int64
            minimum: 0
            type: integer
        - explode: false
          in: query
          name: action
          schema:
            enum:
              - INSERT
              - UPDATE
              - DELETE
            type: string
        - explode: false
          in: query
          name: target_table
          schema:
            type: string
        - explode: false
          in: query
          name: target_id
          schema:
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminListAuditOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Read the audit trail (paginated, newest first, filterable)
      tags:
        - admin/audit
  /brackets:
    get:
      operationId: admin-list-brackets
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminListBracketsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List brackets
      tags:
        - admin/brackets
    post:
      operationId: admin-create-bracket
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateBracketInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBracketBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a bracket
      tags:
        - admin/brackets
  /brackets/{id}:
    delete:
      operationId: admin-delete-bracket
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a bracket (members are unassigned, not deleted)
      tags:
        - admin/brackets
    patch:
      operationId: admin-update-bracket
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateBracketInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBracketBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a bracket (partial)
      tags:
        - admin/brackets
  /challenges:
    post:
      operationId: admin-create-challenge
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateChallengeInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminChallengeBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a challenge
      tags:
        - admin/challenges
  /challenges/order:
    put:
      operationId: admin-reorder-challenges
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReorderInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReorderOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set the board position of many challenges at once
      tags:
        - admin/challenges
  /challenges/{id}:
    delete:
      operationId: admin-delete-challenge
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a challenge (refused while it has solves)
      tags:
        - admin/challenges
    patch:
      operationId: admin-update-challenge
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateChallengeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminChallengeBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a challenge (partial)
      tags:
        - admin/challenges
  /challenges/{id}/files:
    post:
      operationId: admin-upload-file
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                filename:
                  contentMediaType: application/octet-stream
                  description: filename of the file being uploaded
                  format: binary
                  type: string
                name:
                  description: general purpose name for multipart form value
                  type: string
              type: object
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFileBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Attach a file to a challenge
      tags:
        - admin/files
  /challenges/{id}/flags:
    post:
      operationId: admin-add-flag
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAddFlagInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFlagBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Add a flag
      tags:
        - admin/flags
  /challenges/{id}/flags/{flagID}:
    delete:
      operationId: admin-delete-flag
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - in: path
          name: flagID
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a flag
      tags:
        - admin/flags
    patch:
      operationId: admin-update-flag
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - in: path
          name: flagID
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateFlagInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFlagBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a flag (partial)
      tags:
        - admin/flags
  /challenges/{id}/hints:
    post:
      operationId: admin-add-hint
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAddHintInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHintBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Add a hint
      tags:
        - admin/hints
  /challenges/{id}/hints/{hintID}:
    delete:
      operationId: admin-delete-hint
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - in: path
          name: hintID
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a hint
      tags:
        - admin/hints
    patch:
      operationId: admin-update-hint
      parameters:
        - in: path
