components:
  schemas:
    AttemptInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/AttemptInputBody.json
          format: uri
          readOnly: true
          type: string
        flag:
          maxLength: 512
          type: string
      required:
        - flag
      type: object
    AttemptOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/AttemptOutputBody.json
          format: uri
          readOnly: true
          type: string
        first_blood:
          type: boolean
        status:
          type: string
        value:
          format: int32
          type: integer
      required:
        - status
        - first_blood
        - value
      type: object
    BracketBody:
      additionalProperties: false
      properties:
        description:
          type: string
        id:
          format: int64
          type: integer
        name:
          type: string
      required:
        - id
        - name
      type: object
    BracketsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/BracketsOutputBody.json
