info:
  title: flagfish
  version: 1.0.0
openapi: 3.1.0
paths:
  /brackets:
    get:
      operationId: brackets
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BracketsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List scoreboard brackets
      tags:
        - scoreboard
  /challenges:
    get:
      operationId: list-challenges
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the challenge board
      tags:
        - challenges
  /challenges/{id}:
    get:
      operationId: challenge-detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeDetailOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get one challenge with its tags, files and hints
      tags:
        - challenges
  /challenges/{id}/attempt:
    post:
      operationId: attempt
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttemptInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Submit a flag for a challenge
      tags:
        - gameplay
  /challenges/{id}/hints/{hint_id}/unlock:
    post:
      operationId: unlock-hint
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - in: path
          name: hint_id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlockOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Unlock a hint
      tags:
        - gameplay
  /challenges/{id}/solves:
    get:
      operationId: challenge-solves
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolvesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List who solved a challenge
      tags:
        - challenges
  /files/{id}:
    get:
      operationId: download-file
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
