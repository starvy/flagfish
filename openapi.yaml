          readOnly: true
          type: string
        brackets:
          items:
            $ref: "#/components/schemas/BracketBody"
          type:
            - array
            - "null"
      required:
        - brackets
      type: object
    ChallengeDetailOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ChallengeDetailOutputBody.json
          format: uri
          readOnly: true
          type: string
        attribution:
          type: string
        category:
          type: string
        connection_info:
          type: string
        description:
          type: string
        files:
          items:
            $ref: "#/components/schemas/ChallengeFile"
          type:
            - array
            - "null"
        flag_mode:
          type: string
        function:
          type: string
        hints:
          items:
            $ref: "#/components/schemas/ChallengeHint"
          type:
            - array
            - "null"
        id:
          format: int64
          type: integer
        instance:
          $ref: "#/components/schemas/ChallengeInstance"
        locked:
          type: boolean
        max_attempts:
          format: int32
          type: integer
        name:
          type: string
        solve_count:
          format: int64
          type:
            - integer
            - "null"
        solved:
          type: boolean
        state:
          type: string
        tags:
          items:
            type: string
          type:
            - array
            - "null"
        type:
          type: string
        value:
          format: int32
          type: integer
      required:
        - id
        - name
        - category
        - description
        - type
        - value
        - function
        - max_attempts
        - state
        - flag_mode
        - solve_count
        - solved
        - locked
        - tags
        - files
        - hints
      type: object
    ChallengeFile:
