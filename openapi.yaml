        name:
          type: string
        score:
          format: int64
          type:
            - integer
            - "null"
        website:
          type: string
      required:
        - id
        - name
        - score
        - created_at
        - members
      type: object
    TeamMember:
      additionalProperties: false
      properties:
        captain:
          type: boolean
        name:
          type: string
        points:
          format: int64
          type:
            - integer
            - "null"
        solve_count:
          format: int64
          type:
            - integer
            - "null"
        user_id:
          format: int64
          type: integer
      required:
        - user_id
        - name
        - captain
        - solve_count
        - points
      type: object
    TokenListItem:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        description:
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          format: int64
          type: integer
      required:
        - id
        - created_at
        - expires_at
      type: object
    TransferCaptainInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/TransferCaptainInputBody.json
          format: uri
          readOnly: true
          type: string
        user_id:
          format: int64
          type: integer
      required:
        - user_id
      type: object
    UnlockOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/UnlockOutputBody.json
          format: uri
          readOnly: true
          type: string
        charged:
          format: int32
          type: integer
        content:
          type: string
        hint_id:
          format: int64
          type: integer
        score:
          format: int64
          type: integer
      required:
        - hint_id
        - content
        - charged
        - score
      type: object
    UpdateMeInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/UpdateMeInputBody.json
          format: uri
          readOnly: true
          type: string
        affiliation:
          maxLength: 255
          type:
            - string
            - "null"
        country:
          maxLength: 64
          type:
            - string
            - "null"
        language:
          maxLength: 35
          type:
            - string
            - "null"
        website:
          maxLength: 255
          type:
            - string
            - "null"
      type: object
    UpdateMyTeamInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/UpdateMyTeamInputBody.json
          format: uri
          readOnly: true
          type: string
        affiliation:
          maxLength: 255
          type:
            - string
            - "null"
        country:
          maxLength: 64
          type:
            - string
            - "null"
        email:
          format: email
          maxLength: 255
          type:
            - string
            - "null"
        website:
          maxLength: 255
          type:
            - string
            - "null"
      type: object
    UserProfileBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/UserProfileBody.json
          format: uri
          readOnly: true
          type: string
        affiliation:
          type: string
        bracket_id:
          format: int64
          type: integer
        bracket_name:
          type: string
        country:
          type: string
        created_at:
          format: date-time
          type: string
        id:
          format: int64
          type: integer
        name:
          type: string
        score:
          format: int64
          type:
            - integer
            - "null"
        solves:
          items:
            $ref: "#/components/schemas/ProfileSolveBody"
          type:
            - array
            - "null"
        website:
          type: string
      required:
        - id
        - name
        - score
        - created_at
        - solves
      type: object
info:
  title: flagfish
  version: 1.0.0
openapi: 3.1.0
paths:
  /brackets:
    get:
      operationId: brackets
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BracketsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List scoreboard brackets
      tags:
        - scoreboard
  /challenges:
    get:
      operationId: list-challenges
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the challenge board
      tags:
        - challenges
  /challenges/{id}:
    get:
      operationId: challenge-detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeDetailOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get one challenge with its tags, files and hints
      tags:
        - challenges
  /challenges/{id}/attempt:
    post:
      operationId: attempt
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttemptInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Submit a flag for a challenge
      tags:
        - gameplay
  /challenges/{id}/hints/{hint_id}/unlock:
    post:
      operationId: unlock-hint
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - in: path
          name: hint_id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlockOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Unlock a hint
      tags:
        - gameplay
  /challenges/{id}/solves:
    get:
      operationId: challenge-solves
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - explode: false
          in: query
          name: cursor
          schema:
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolvesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List who solved a challenge
      tags:
        - challenges
  /files/{id}:
    get:
      operationId: download-file
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Download a challenge file
      tags:
        - challenges
  /instance:
    get:
      operationId: instance
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Public instance branding and theme
      tags:
        - instance
  /login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionOutputBody"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Log in with email and password
      tags:
        - auth
  /logout:
    post:
      operationId: logout
      parameters:
        - in: cookie
          name: flagfish_session
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearedOutputBody"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Log out the current session
      tags:
        - auth
  /me:
    get:
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get the current account
      tags:
        - auth
    patch:
      operationId: update-me
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update the current account's profile
      tags:
        - auth
  /me/email:
    patch:
      operationId: change-email
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeEmailInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Request an email change (sends a confirmation to the new address)
      tags:
        - auth
  /me/fields:
    put:
      operationId: answer-fields
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerFieldsInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerFieldsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Answer or edit the caller's custom registration fields
      tags:
        - auth
  /me/name:
    patch:
      operationId: change-name
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeNameInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Change the current account's display name
      tags:
        - auth
  /me/password:
    post:
      operationId: change-password
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionOutputBody"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Change the current account's password (revokes all of its API tokens)
      tags:
        - auth
  /me/team:
    delete:
      operationId: disband-team
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeftTeamOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Disband the caller's team (captain only, no history)
      tags:
        - teams
    get:
      operationId: my-team
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: The caller's team
      tags:
        - teams
    patch:
      operationId: update-my-team
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyTeamInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update the caller's team (captain only)
      tags:
        - teams
  /me/team/captain:
    put:
      operationId: transfer-captaincy
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferCaptainInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Hand captaincy to another member (captain only)
      tags:
        - teams
  /me/team/leave:
    post:
      operationId: leave-team
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeftTeamOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Leave the caller's team
      tags:
        - teams
  /me/team/members/{userID}:
    delete:
      operationId: kick-team-member
      parameters:
        - in: path
          name: userID
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove a member from the caller's team (captain only)
      tags:
        - teams
  /me/team/password:
    put:
      operationId: set-team-join-password
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetJoinSecretInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeftTeamOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Rotate the team's join password (captain only)
      tags:
        - teams
  /notifications:
    get:
      operationId: list-notifications
      parameters:
        - explode: false
          in: query
          name: page
          schema:
            default: 1
            format: int64
            maximum: 1000000
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: per_page
          schema:
            default: 50
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListNotificationsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List notifications (paginated)
      tags:
        - notifications
  /pages:
    get:
      operationId: list-pages
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPagesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List published content pages
      tags:
        - pages
  /pages/{route}:
    get:
      operationId: get-page
      parameters:
        - in: path
          name: route
          required: true
          schema:
            maxLength: 64
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get one published content page by its route
      tags:
        - pages
  /register:
    post:
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionOutputBody"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Register a new account
      tags:
        - auth
  /register/fields:
    get:
      operationId: registration-fields
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationFieldsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the custom fields shown on the registration form
      tags:
        - auth
  /reset-password:
    patch:
      operationId: reset-apply
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokedOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set a new password with a reset token (revokes all of the account's API tokens)
      tags:
        - auth
    post:
      operationId: reset-request
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestResetInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Request a password reset email
      tags:
        - auth
  /scoreboard:
    get:
      operationId: scoreboard
      parameters:
        - explode: false
          in: query
          name: limit
          schema:
            default: 100
            format: int64
            maximum: 1000
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: as_of
          schema:
            format: date-time
            type: string
        - explode: false
          in: query
          name: preview
          schema:
            type: boolean
        - explode: false
          in: query
          name: bracket
          schema:
            format: int64
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreboardOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get the standings
      tags:
        - scoreboard
  /scoreboard/{id}:
    get:
      operationId: scoreboard-detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - explode: false
          in: query
          name: as_of
          schema:
            format: date-time
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreHistoryOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: One account's cumulative score over time (freeze-safe; honours ?as_of)
      tags:
        - scoreboard
  /teams:
    post:
      operationId: create-team
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a team and become its captain
      tags:
        - teams
  /teams/join:
    post:
      operationId: join-team
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinTeamInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Join a team by name and password
      tags:
        - teams
  /teams/{id}:
    get:
      operationId: team-detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: A team's public profile
      tags:
        - teams
  /tokens:
    get:
      operationId: list-tokens
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTokensOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the caller's API tokens
      tags:
        - tokens
    post:
      operationId: create-token
      requestBody:
        content:
          application/json:
